<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rezan Macro Terminal</title><style>__CSS__</style></head><body>
<header class="top">
  <button class="burger" id="burger" title="Toggle modules">☰</button>
  <div class="logo"><span class="mk">R</span><span>REZAN MACRO TERMINAL<br><small>GOLD · FX · MACRO · EDUCATIONAL</small></span></div>
  <div class="status"><span id="light" class="light"></span><b id="livestate">LOADING</b>
    <span class="lbl">· last update</span> <span id="lastupd">--:--:--</span> <span class="lbl">· next in</span> <span id="nextin">-:--</span>
    <span id="nexthi" class="nexthi"></span>
    <button class="btn ghost sm" id="themebtn">☀ LIGHT</button><button class="btn" id="refbtn">REFRESH NOW</button></div>
</header>
<div class="banner" id="banner"></div>
<div class="ticker"><div class="track" id="tickTrack"><span class="tk dim">Loading live quotes...</span></div></div>
<div class="shell">
  <aside id="side"><input class="filter" id="filter" placeholder="⌕ Filter modules..."><div id="nav"></div></aside>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<footer><div class="disc" id="disc"></div><div id="srcs"></div></footer>
<script>const DATA=__DATA__;</script>
<script>__APP__</script>
</body></html>
