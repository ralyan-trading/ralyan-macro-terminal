<title>Rezan Macro Terminal</title><style>:root{--topbg:rgba(8,12,22,.96);--line:#141c30;--mid:#3a4766;--cell:#141c30;--cell0:#0b1020;--hi:#fff;--hd:#e7ecf5;--pnb:#0b1120;--trk:#18213a;--needle:#fff;--grid:#111a2b;--bg:#060910;--bg2:#0a0f1b;--pn:#0d1322;--pn2:#111a2c;--bd:#1b2540;--tx:#c8d0e0;--dim:#6c7893;--or:#ff8a1f;--or2:#ffb057;--gr:#19c37d;--rd:#ff4d5e;--yl:#ffd34d;--bl:#4aa3ff;--mono:"JetBrains Mono","DejaVu Sans Mono",Consolas,monospace;--sans:Inter,"Segoe UI","DejaVu Sans",Arial,sans-serif}
*{box-sizing:border-box}html{background:#060910}html:has(body.theme-light){background:#eef1f6}html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans)}
body{background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);background-size:22px 22px}
a{color:var(--or2)}
.mono,.num{font-family:var(--mono)} .up{color:var(--gr)} .dn{color:var(--rd)} .fl{color:var(--dim)} .dim{color:var(--dim)} .or{color:var(--or)} .yl{color:var(--yl)}
/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--topbg);border-bottom:1px solid var(--bd);backdrop-filter:blur(6px)}
.burger{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;color:var(--hi);white-space:nowrap}
.logo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--or),#ff5a1f);display:grid;place-items:center;color:#0a0a0a;font:800 13px var(--mono)}
.logo small{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:1px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--tx);flex-wrap:wrap;justify-content:flex-end}
.light{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block}
.light.ok{background:var(--gr);box-shadow:0 0 10px var(--gr)} .light.warn{background:var(--yl);box-shadow:0 0 10px var(--yl)} .light.bad{background:var(--rd);box-shadow:0 0 10px var(--rd)}
#livestate.stale{color:var(--rd);font-weight:700}
.btn{background:var(--or);color:#140a00;border:0;border-radius:8px;padding:5px 11px;font:700 11px var(--mono);cursor:pointer;letter-spacing:.5px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)} .btn.sm{padding:3px 8px;font-size:10.5px}
.btn.on{background:var(--or);color:#140a00;border-color:var(--or)}
/* ticker */
.ticker{overflow:hidden;border-bottom:1px solid var(--bd);background:var(--bg2);white-space:nowrap}
.track{display:inline-block;padding:6px 0;animation:scroll 60s linear infinite;font:12px var(--mono)} .ticker:hover .track{animation-play-state:paused}
.tk{display:inline-block;margin:0 18px}.tk b{color:var(--hi);margin-right:6px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* shell */
.shell{display:flex;min-height:calc(100vh - 90px)}
aside{width:236px;flex:0 0 236px;background:var(--bg2);border-right:1px solid var(--bd);padding:10px;position:sticky;top:84px;height:calc(100vh - 84px);overflow:auto;transition:margin .2s}
body.side-off aside{margin-left:-236px}
.filter{width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:7px 9px;font:12px var(--mono);margin-bottom:8px}
.grp{margin-bottom:6px} .grp>.gh{display:flex;justify-content:space-between;cursor:pointer;color:var(--dim);font:600 10.5px var(--mono);letter-spacing:1.2px;padding:6px 4px;border-top:1px solid var(--bd);user-select:none}
.grp.closed .items{display:none} .grp .gh .car{transition:transform .2s} .grp.closed .gh .car{transform:rotate(-90deg)}
.it{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;color:var(--tx);text-decoration:none;font:12px var(--mono);letter-spacing:.4px}
.it:hover{background:var(--pn2)} .it.act{background:rgba(255,138,31,.12);color:var(--or2);box-shadow:inset 2px 0 0 var(--or)}
.tag{white-space:nowrap;font:700 9px var(--mono);padding:1px 6px;border-radius:5px;letter-spacing:.8px}
.tag.live{color:var(--or);border:1px solid rgba(255,138,31,.5);background:rgba(255,138,31,.1)} .tag.daily{color:var(--bl);border:1px solid rgba(74,163,255,.4)} .tag.na{color:var(--dim);border:1px solid var(--bd)}
main{flex:1;min-width:0;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;grid-auto-flow:row dense}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.card{background:linear-gradient(180deg,var(--pn),var(--pnb));border:1px solid var(--bd);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.hide{display:none} .card.flash{box-shadow:0 0 0 1px var(--or)}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);font:700 11.5px var(--mono);letter-spacing:1px;color:var(--hd)}
.ch .num0{color:var(--or);font-size:10px} .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:10px 12px} .scroll{overflow-x:auto}
.asof{font:10.5px var(--mono);color:var(--dim);margin-top:6px}
table{border-collapse:collapse;width:100%;font:12px var(--mono)} th{color:var(--dim);font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:normal;vertical-align:top} td.r,th.r{text-align:right;white-space:nowrap} .hm td{white-space:nowrap}
/* scorecard */
.sc{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}
.verdict{font:800 26px var(--sans);letter-spacing:.5px} .vsub{font:11px var(--mono);color:var(--dim)}
.bars .row{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;padding:4px 0;font:12px var(--mono)}
.bar{position:relative;height:8px;background:var(--trk);border-radius:6px} .bar i{position:absolute;top:0;height:100%;border-radius:6px} .bar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mid)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px} .sw>div{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:12px var(--mono)}
.pill{display:inline-block;padding:1px 7px;border-radius:6px;font:700 10px var(--mono)} .pill.up{background:rgba(25,195,125,.14)} .pill.dn{background:rgba(255,77,94,.14)} .pill.fl{background:var(--trk)}
/* heatmap */
.hm td{text-align:center;padding:5px 4px;font-weight:700;border:1px solid var(--cell0)} .hm th{text-align:center}
/* cot */
.cots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cot{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:9px 10px;font:12px var(--mono)} .cot .nm{display:flex;justify-content:space-between;color:var(--hi);font-weight:700}
.cot .big{font:800 19px var(--mono);margin:3px 0} .lb{height:6px;background:var(--rd);border-radius:5px;overflow:hidden;margin:5px 0} .lb i{display:block;height:100%;background:var(--gr)}
/* sessions */
.ses{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font:12px var(--mono);padding:4px 0}
.ses .pb{height:8px;background:var(--trk);border-radius:5px;overflow:hidden}.ses .pb i{display:block;height:100%;background:var(--or)}
/* regime */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px} .quad div{border:1px solid var(--bd);border-radius:10px;padding:8px;font:11.5px var(--mono);color:var(--dim);min-height:58px} .quad div.on{border-color:var(--or);color:var(--hi);background:rgba(255,138,31,.1)}
.news a{color:var(--tx);text-decoration:none} .news .n{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px} .news .t{font:10.5px var(--mono);color:var(--dim);margin-right:6px}
.nabox{display:grid;place-items:center;min-height:110px;text-align:center;color:var(--dim);font:12px var(--mono)} .nabox b{color:var(--tx);display:block;margin-bottom:4px}
.brief p{margin:0 0 7px} .rules h4{margin:8px 0 3px;color:var(--or2);font:700 12px var(--mono)} .rules li{margin:2px 0} .rules ul{margin:0;padding-left:18px;font-size:12px}
.al label{display:flex;align-items:center;gap:8px;margin:5px 0;font:12px var(--mono)} .al input[type=number]{width:96px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:4px 6px;font:12px var(--mono)}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--pn2);border:1px solid var(--or);color:var(--hi);padding:10px 14px;border-radius:10px;font:12px var(--mono);max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chart svg{display:block;width:100%;height:auto}

.feeds td:first-child{color:var(--hi)}

.fr{font:600 9.5px var(--mono);color:var(--dim);white-space:nowrap;letter-spacing:.3px} .fr.stale{color:var(--rd)}
.ch .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nexthi{font:11px var(--mono);color:var(--dim);white-space:nowrap} .nexthi b{color:var(--tx)} .nexthi.soon,.nexthi.soon b{color:var(--rd);animation:blink 1s steps(2) infinite}

.cd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 6px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;font:12px var(--mono);background:var(--bg2)} .cd .cdv{margin-left:auto;font:800 18px var(--mono);color:var(--or)}
.cd.soon{border-color:var(--rd);background:rgba(255,77,94,.12)} .cd.soon .cdv{color:var(--rd);animation:blink 1s steps(2) infinite}
tr.soonrow td{background:rgba(255,77,94,.14)}
.sub{font:700 10.5px var(--mono);color:var(--dim);letter-spacing:1px;margin:8px 0 2px}
.fv{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;align-items:center} .grp2{display:inline-flex;gap:4px;align-items:center;font:10px var(--mono)}
.smcsum{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font:11.5px var(--mono)}

  main{padding:8px}

  <label>Pair |score| ≥ <input type="number" id="al_pair" step="1" value="${c.pair ?? 6}"></label>
  <label><input type="checkbox" id="al_ev" ${c.ev ? "checked" : ""}> Warn 30 min & 5 min before high-impact events</label>
  <label><input type="checkbox" id="al_snd" ${c.sound ? "checked" : ""}> Sound</label>
  <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn sm" id="al_save">SAVE</button><button class="btn ghost sm" id="al_test">TEST SOUND</button><button class="btn ghost sm" id="al_perm">BROWSER NOTIFICATIONS</button></div>
  <div class="asof">Checked on every refresh (prices) and every second (event countdown) while this page is open. Fires once per crossing. Browsers need one click on the page before sound can play. Notification permission: ${"Notification" in window ? esc(Notification.permission) : "unsupported"}.</div></div>`;
  $("al_save").onclick = () => { const n = (id) => { const v = $(id).value; return v === "" ? null : +v; };
    const c2 = alertCfg(); Object.assign(c2, { on: $("al_on").checked, above: n("al_above"), below: n("al_below"), pair: n("al_pair"), ev: $("al_ev").checked, sound: $("al_snd").checked, fired: {} }); saveCfg(c2); toast("Alerts saved"); };
  $("al_test").onclick = () => beep("urgent");
  $("al_perm").onclick = () => { if ("Notification" in window) Notification.requestPermission().then(() => rAlerts()); };
}
function checkAlerts(P) {
  const c = alertCfg(); if (!c.on) return; const f = c.fired || {}; const gp = goldPx(), px = gp && gp.px;
  const fire = (key, cond, msg) => { if (cond && !f[key]) { f[key] = 1; notify(msg); } else if (!cond) delete f[key]; };
  if (px && c.above != null) fire("above", px >= c.above, `Gold ${fx(px)} is above ${c.above}`);
  if (px && c.below != null) fire("below", px <= c.below, `Gold ${fx(px)} is below ${c.below}`);
  if (c.pair != null && P) P.forEach((p) => fire("p_" + p.pair, Math.abs(p.score) >= c.pair, `${p.pair} score ${sgn(p.score, 0)} (${pairLabel(p.score)})`));
  c.fired = f; saveCfg(c);
}
function tickEvents() {
  const nh = nextHigh(), now = Date.now(), el = $("nexthi");
  if (!nh) { el.textContent = ""; el.className = "nexthi"; } else { const left = nh.t - now; el.className = "nexthi" + (left < 30 * 60e3 ? " soon" : "");
    el.innerHTML = `<span class="lbl">NEXT HIGH:</span> ${esc(nh.ccy)} ${esc(nh.title.length > 26 ? nh.title.slice(0, 25) + "…" : nh.title)} <b>${left <= 0 ? "NOW" : dur(left)}</b>`;
    const c = alertCfg(); if (c.ev) { const key = "ev_" + nh.t, f = c.fired || {};
      [[30, "30 min"], [5, "5 min"]].forEach(([m, lbl]) => { if (left > 0 && left <= m * 60e3 && !f[key + m]) { f[key + m] = 1; c.fired = f; saveCfg(c); notify(`${nh.ccy} ${nh.title} in ${lbl}`, "urgent"); } }); } }
  document.querySelectorAll("[data-cd]").forEach((x) => { const l = +x.dataset.cd - now; x.textContent = l <= 0 ? "NOW" : dur(l); const p = x.closest(".cd"); if (p) p.classList.toggle("soon", l < 30 * 60e3); });
}

/* ------------------------------------------------------------ per-card freshness */
function rFresh() {
  MODULES.forEach((m) => { const el = $("f_" + m.id); if (!el || m.clock) return;
    if (m.daily) { const t = String(m.daily() || ""), d = t.match(/\d{4}-\d{2}-\d{2}/); el.textContent = d ? "data " + d[0].slice(5) : "manual"; el.title = t; el.className = "fr"; return; }
    if (!m.feeds) { el.textContent = ""; return; }
    const keys = m.id === "chart" ? (st.chartSrc === "XAU" ? ["xauH", "xauD"] : ["pxH", "pxD"]) : m.feeds;
    const fs = keys.map((k) => st.feeds[k]).filter(Boolean); if (!fs.length) { el.textContent = ""; return; }
    const oks = fs.filter((f) => f.okAt).map((f) => f.okAt.getTime()); const bad = fs.some((f) => !f.ok);
    el.className = "fr" + (bad ? " stale" : ""); el.textContent = oks.length ? (bad ? "STALE · " : "⟳ ") + hm(new Date(Math.min(...oks))) : "NO DATA";
    el.title = fs.map((f) => `${f.label}: ${f.ok ? "ok" : "failed"} ${f.okAt ? "last ok " + hms(f.okAt) : ""}`).join("\n"); });
}

/* ------------------------------------------------------------ main loop */
function renderAll() {
  const safe = (fn, id) => { try { fn(); } catch (e) { console.error("render " + id, e); const el = $("b_" + id); if (el) el.innerHTML = `<span class="dn">Render error: ${esc(e.message)}</span>`; } };
  let G = null, sc = null, P = null;
  safe(smcAll, "chart");
  safe(() => { G = goldScore(); rScore(G); }, "score");
  safe(() => rFund(G), "fund"); safe(() => rConf(G), "conf");
  safe(() => { sc = ccyScores(); rStrength(sc); P = pairs(sc); rHeatmap(sc, P); }, "strength");
  safe(rCOT, "cot"); safe(rChart, "chart"); safe(rMarkets, "markets"); safe(rCorr, "corr"); safe(rRates, "rates"); safe(rRegime, "regime"); safe(rFed, "fed");
  safe(rSurprise, "surprise"); safe(rCalendar, "calendar"); safe(rNews, "news"); safe(rFlows, "flows"); safe(rRules, "rules"); safe(rNA, "na_options"); safe(rFeeds, "feeds");
  if (G && sc && P) { safe(() => rBrief(G, sc, P), "brief"); safe(() => rPlaybook(G, sc, P), "playbook"); }
  safe(() => rTicker(sc), "ticker"); safe(rFresh, "feeds"); checkAlerts(P);
  window.__rezan = { G, sc, P, smc: st.smc };
}
const JOBS = [
  ["gold", "XAU spot (gold-api.com)", fGold], ["silver", "XAG spot (gold-api.com)", fSilver], ["quotes", "Cross-asset quotes (CNBC, unofficial)", fQuotes],
  ["kraken", "FX intraday fallback (Kraken)", fKraken], ["btc", "BTC-USD (Coinbase)", fBtc], ["paxg", "PAXG spot (Coinbase)", fPaxg],
  ["xauH", "XAU 1H → 1H/4H (CNBC chart)", fXauH], ["xauD", "XAU daily (CNBC chart)", fXauD, 30], ["pxH", "PAXG 1H x600 (Coinbase)", fPxH], ["pxD", "PAXG 1D (Coinbase)", fPxD, 30],
  ["news", "News (FXStreet/rss2json)", fNews], ["fx", "FX series (Frankfurter/ECB)", fFX, 30], ["cot", "COT (CFTC public API)", fCOT, 30], ["tsy", "US yields (Treasury XML)", fTsy, 60, true]];
let busy = false, nextAt = 0, timer = null, retryT = null, lastRun = 0;
const due = (j, force) => force || !j[3] || !st.feeds[j[0]] || !st.feeds[j[0]].okAt || Date.now() - st.feeds[j[0]].okAt > j[3] * 60e3;
async function runJobs(list) { const res = await Promise.allSettled(list.map((j) => j[2]()));
  res.forEach((r, i) => { const j = list[i]; feed(j[0], j[1], r.status === "fulfilled", r.status === "fulfilled" ? (typeof r.value === "string" ? r.value : "") : String((r.reason && r.reason.message) || r.reason)); if (r.status === "rejected") console.warn("feed failed:", j[1], r.reason); });
  return list.filter((j, i) => res[i].status === "rejected").map((j) => j[1].split(" (")[0]); }
function setStatus(failed) {
  const goldOk = (st.feeds.gold && st.feeds.gold.ok) || (st.feeds.quotes && st.feeds.quotes.ok && st.q && st.q["XAU="]);
  $("light").className = "light " + (!goldOk ? "bad" : failed.length ? "warn" : "ok");
  if (goldOk) { $("livestate").textContent = failed.length ? `LIVE · partial (${failed.length} feed${failed.length > 1 ? "s" : ""} stale)` : "LIVE"; $("livestate").title = failed.join(", "); $("livestate").className = ""; $("lastupd").textContent = hms(new Date()); }
  else { $("livestate").textContent = "STALE · fetch failed"; $("livestate").className = "stale"; }
  window.__liveStatus = { goldOk: !!goldOk, failed, at: Date.now() };
}
async function refresh(force) {
  if (busy) return; busy = true; lastRun = Date.now(); $("light").className = "light warn"; $("livestate").textContent = "UPDATING"; $("livestate").className = "";
  const fast = JOBS.filter((j) => !j[4] && due(j, force)), slow = JOBS.filter((j) => j[4] && due(j, force));
  const slowP = slow.length ? runJobs(slow) : Promise.resolve([]);
  let failed = await runJobs(fast); renderAll(); setStatus(failed.concat(st.slowFailed || []));
  slowP.then((sf) => { st.slowFailed = sf; if (slow.length) { renderAll(); setStatus(failed.concat(sf)); } });
  clearTimeout(retryT); if (failed.length) retryT = setTimeout(() => refresh(false), 60e3);
  busy = false;
}
function schedule() { clearInterval(timer); nextAt = Date.now() + INTERVAL; timer = setInterval(() => { nextAt = Date.now() + INTERVAL; refresh(false); }, INTERVAL); }
// 24/7 robustness: background tabs throttle timers -> refresh on focus/reconnect; reload every 6h (hosted copy may have a newer daily build)
const loadedAt = Date.now(); let lastInput = Date.now();
["pointerdown", "keydown", "wheel"].forEach((e) => window.addEventListener(e, () => (lastInput = Date.now()), { passive: true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastRun > INTERVAL) { refresh(false); schedule(); } });
window.addEventListener("online", () => { refresh(true); schedule(); });
setInterval(() => { if (Date.now() - loadedAt > 6 * 3600e3 && Date.now() - lastInput > 5 * 60e3 && navigator.onLine) location.reload(); }, 10 * 60e3);
let rz = null; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { try { rChart(); } catch (e) {} }, 300); });
buildShell(); rAlerts(); rSessions(); tickEvents();
setInterval(() => { const s = Math.max(0, Math.round((nextAt - Date.now()) / 1000)); $("nextin").textContent = Math.floor(s / 60) + ":" + pad(s % 60); rSessions(); tickEvents(); }, 1000);
refresh(true); schedule();
})();
</script>
